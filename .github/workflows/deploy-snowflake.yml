name: Snowflake Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16"

      - name: Check Snowflake environment
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          if [ -z "$SNOWFLAKE_ACCOUNT" ]; then
            echo "SNOWFLAKE_ACCOUNT is EMPTY"
            exit 1
          fi

          echo "SNOWFLAKE_ACCOUNT is populated"
          echo "Account identifier length: ${#SNOWFLAKE_ACCOUNT}"
          echo "Authenticator: ${SNOWFLAKE_AUTHENTICATOR}"
          echo "Workload identity provider: ${SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER}"

      - name: Test Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          snow connection test -x
